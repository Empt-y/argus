# Argus daemon configuration.
#
#   sudo install -Dm600 -o argus -g argus deploy/argus.example.toml /etc/argus/argus.toml
#
# This file holds secrets. Keep it 0600 and owned by the argus user.

[server]
# Loopback by default. Widening this brokers every credential below to anyone
# who can reach the port — prefer reaching it over Tailscale to exposing it on
# the LAN, and set provider-side budget caps before doing either.
bind = "127.0.0.1:8787"
allowed_origins = ["http://localhost:5173"]

# Who has to present a device token.
#   loopback_exempt - requests from this machine skip the check (the default:
#                     anything that can reach 127.0.0.1 here can already read
#                     this file, so a token would protect nothing)
#   required        - everyone needs one, including this machine
auth = "loopback_exempt"

# How clients reach this server. Used for the tile URLs in /v1/style.json and
# for the pairing QR, so it must be an address a *phone* can resolve — the bind
# address is right only while everything is on this machine. Defaults to bind.
# public_url = "https://<host>.<tailnet>.ts.net"

[database]
url = "postgres://argus@localhost/argus"
max_connections = 16

[capture]
# Outside the areas of interest below, poll this many times slower. Global
# aircraft capture at full rate is roughly 57 million rows a day; at 4x it is a
# quarter of that, and the AOIs still get full fidelity.
global_cadence_scale = 4.0
disk_budget_gb = 80
disk_warn_fraction = 0.85

[retention]
raw = "7 days"
tracks = "90 days"

# The only credentials that reach the browser — CesiumJS needs them directly to
# load the photorealistic tileset. Restrict both at the provider (HTTP referrer
# for Google, token scope for ion); that restriction is what protects them.
[client_keys]
# google_maps_api_key = ""
# cesium_ion_token = ""

# Full-cadence capture areas. Add one per region you actually watch.
[[aoi]]
name = "home"
bbox = [-2.5, 51.0, 0.5, 52.5]

# --- sources -----------------------------------------------------------------
# Every source runs keyless unless noted. Omitting a section leaves the source
# enabled at its declared cadence.

# OpenSky is the last member of the flights chain. Anonymous access works fully
# at 400 credits/day; an account raises that tenfold. Because it is reached only
# when both unmetered aggregators are down, its allowance is charged at the
# worst-case tariff — under-using it costs nothing, overrunning it earns 429s.
[sources.opensky]
enabled = true
# credentials = { client_id = "", client_secret = "" }

# Layers served by a provider chain are toggled by the LAYER id, not by the
# individual providers. Disabling a member is done by removing it from the chain
# in code; the config decides whether the layer runs at all.
[sources.earthquakes]
enabled = true    # chain: usgs-quakes -> emsc-quakes

[sources.flights]
enabled = true    # chain: adsb-lol -> adsb-fi -> opensky

[sources.celestrak]
enabled = true
# Tracks a curated ~1,100-object core catalogue: stations, naked-eye visible,
# all four GNSS constellations, weather, science, and the geostationary belt.
# The full 16,469-object active catalogue is deliberately not the default — at a
# 60-second propagation cadence it is ~23 million rows a day.

# Keyless sources. Each is on by default; set enabled = false to drop a layer.
# Chains (earthquakes, flights) are toggled by layer id, as above.
[sources.nws-alerts]
enabled = true    # US NWS weather alerts

[sources.sigmets]
enabled = true    # aviation hazard polygons, NOAA AWC

[sources.radiosondes]
enabled = true    # weather balloons, SondeHub

[sources.storm-overflows]
enabled = true    # UK sewage discharge, nine water companies

[sources.flood-warnings]
enabled = true    # Environment Agency, England

[sources.river-gauges]
enabled = true    # Environment Agency river, tide and rainfall gauges, UK

[sources.buoys]
enabled = true    # NOAA NDBC buoys and coastal stations

[sources.argo-floats]
enabled = true    # Argo profiling floats, last surfacing of each, hourly

[sources.meteors]
enabled = true    # Global Meteor Network trajectories, a week on first start

[sources.ground-stations]
enabled = true    # SatNOGS ground stations and what each is listening to

[sources.road-disruptions]
enabled = true    # Transport for London road disruptions, Greater London

[sources.carbon-intensity]
enabled = true    # Grid carbon intensity by DNO region, on real boundaries

[sources.metars]
enabled = true    # Aerodrome METARs and TAFs, worldwide, from the AWC bulk cache

# Keyed sources, off until a credential is supplied.
[sources.buses]
enabled = true
# Every local bus in England, from the Bus Open Data Service. Registration is
# free at https://data.bus-data.dft.gov.uk/ and the key is on the account page.
# Bounded: it asks about the [[aoi]] boxes, and the whole country is 31 MB of
# XML per poll, so an AOI that covers England costs what England costs.
# cadence_secs = 60
# credentials = { api_key = "" }

[sources.aisstream]
enabled = false
# credentials = { api_key = "" }

[sources.firms]
enabled = false
# credentials = { map_key = "" }

[sources.tomtom]
enabled = false
# credentials = { api_key = "" }
