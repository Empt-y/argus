[workspace]
resolver = "3"
members = [
    "crates/argus-core",
    "crates/argus-store",
    "crates/argus-ingest",
    "crates/argus-tiles",
    "crates/argus-present",
    "crates/argus-analyze",
    "crates/argus-alert",
    "crates/argus-api",
    "crates/argusd",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/Empt-y/argus"

[workspace.dependencies]
# --- internal ---
argus-core = { path = "crates/argus-core" }
argus-store = { path = "crates/argus-store" }
argus-ingest = { path = "crates/argus-ingest" }
argus-tiles = { path = "crates/argus-tiles" }
argus-present = { path = "crates/argus-present" }
argus-analyze = { path = "crates/argus-analyze" }
argus-alert = { path = "crates/argus-alert" }
argus-api = { path = "crates/argus-api" }

# --- async runtime + http ---
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "compression-gzip", "fs"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "gzip",
    "brotli",
    "stream",
    # Space-Track has no API key: it issues a session cookie in exchange for an
    # account login, so a client that cannot hold a cookie cannot talk to it.
    "cookies",
    # Resolve in-process rather than through glibc. A daemon polling ~30 hosts
    # on 15-second cadences makes a great many lookups, and glibc walks
    # /etc/resolv.conf serially — one blackholed nameserver listed first stalls
    # every request for seconds before it falls back. hickory queries in
    # parallel and caches, so a broken entry costs nothing.
    "hickory-dns",
] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

# --- storage ---
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "chrono",
    "uuid",
    "json",
    "macros",
    "migrate",
] }

# --- serialisation + errors ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"

# --- observability ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# --- geo ---
geo = "0.29"
geo-types = { version = "0.7", features = ["serde"] }
geozero = { version = "0.14", features = ["with-postgis-sqlx", "with-mvt", "with-geo"] }
sgp4 = "2"

# --- misc ---
sha2 = "0.10"
hex = "0.4"
qrcode = { version = "0.14", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
async-trait = "0.1"
futures = "0.3"
governor = "0.7"
rand = "0.8"
base64 = "0.22"
csv = "1"
flate2 = "1"
quick-xml = { version = "0.37", features = ["serialize"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
