# The system JVM here is 25, which the Android Gradle Plugin does not support.
# Pinning it in the project rather than switching the machine's default keeps
# the rest of the system on 25, where everything else wants it.
org.gradle.java.home=/opt/openjdk-bin-21

org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
